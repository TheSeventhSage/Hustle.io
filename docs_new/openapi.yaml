openapi: 3.0.3
info:
  title: Hustle App API
  version: 1.0.0
servers:
  - url: https://your-domain.com/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    BookingRequest:
      type: object
      required: [provider_service_id, booking_mode, scheduled_start_at]
      properties:
        provider_service_id: { type: integer }
        booking_mode: { type: string, enum: [come_now, scheduled] }
        scheduled_start_at: { type: string, format: date-time }
        expected_duration_minutes: { type: integer }
        service_location_text: { type: string }
        insurance_rate_pct: { type: number }
    HustleApplicationRequest:
      type: object
      required: [pricing_model, offered_amount, currency_code]
      properties:
        pricing_model: { type: string, enum: [per_service, full_amount, per_hour] }
        offered_amount: { type: number }
        currency_code: { type: string }
        expected_completion_at: { type: string, format: date-time }
    ReviewRequest:
      type: object
      required: [target_type, review_subject_account_id, rating]
      properties:
        target_type: { type: string, enum: [artisan, company] }
        review_subject_account_id: { type: integer }
        job_id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        feedback_text: { type: string }
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
  /categories:
    get:
      summary: List categories
      responses:
        '200': { description: OK }
  /services:
    get:
      summary: List provider services
      responses:
        '200': { description: OK }
  /bookings:
    post:
      summary: Create booking
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201': { description: Booking created }
  /hustles:
    get:
      summary: List hustle posts
      responses:
        '200': { description: OK }
    post:
      summary: Create hustle post
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Hustle created }
  /hustles/{id}/applications:
    post:
      summary: Apply to hustle post
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HustleApplicationRequest'
      responses:
        '201': { description: Application created }
  /jobs:
    get:
      summary: List jobs for current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /jobs/{id}/complete:
    post:
      summary: Mark job complete
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Job completed }
  /wallet:
    get:
      summary: Wallet summary
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /reviews:
    post:
      summary: Create review
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201': { description: Review created }
  /admin/dashboard:
    get:
      summary: Admin dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
